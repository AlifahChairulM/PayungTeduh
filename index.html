<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayungTeduh - Smart Umbrella Locker</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 border border-slate-200">
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">☔ PayungTeduh</h1>
      <p class="text-xs text-slate-500 font-medium mt-1">Sistem Loker Payung Otomatis</p>
    </div>

    <!-- Form Identitas & Peminjaman -->
    <form id="form-transaksi" onsubmit="prosesTransaksi(event)" class="space-y-4">
      
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nama Lengkap</label>
        <input type="text" id="nama" required placeholder="Masukkan nama..." 
          class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email Aktif</label>
        <input type="email" id="email" required placeholder="nama@email.com" 
          class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Bank / e-Wallet</label>
          <select id="bank" required class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
            <option value="BCA">BCA</option>
            <option value="Mandiri">Mandiri</option>
            <option value="GoPay">GoPay</option>
            <option value="OVO">OVO</option>
            <option value="ShopeePay">ShopeePay</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">No. Rekening / HP</label>
          <input type="text" id="no_rek" required placeholder="08xxxx / 123xxxx" 
            class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Pilih Layanan</label>
        <div class="grid grid-cols-2 gap-3 mt-1">
          <label class="border rounded-xl p-3 flex flex-col items-center cursor-pointer hover:bg-blue-50 border-blue-200 transition">
            <input type="radio" name="type" value="SEWA" checked class="mb-1">
            <span class="text-xs font-bold text-blue-700">Sewa Payung</span>
            <span class="text-[10px] text-slate-500">Rp 25.000</span>
            <span class="text-[9px] text-slate-400 font-semibold text-center">(5k Sewa + 20k Jaminan)</span>
          </label>

          <label class="border rounded-xl p-3 flex flex-col items-center cursor-pointer hover:bg-emerald-50 border-emerald-200 transition">
            <input type="radio" name="type" value="TITIP" class="mb-1">
            <span class="text-xs font-bold text-emerald-700">Titip Payung</span>
            <span class="text-[10px] text-slate-500">Rp 6.000</span>
            <span class="text-[9px] text-slate-400 font-semibold text-center">(3k Sewa + 3k Depo)</span>
          </label>
        </div>
      </div>

      <button type="submit" id="btn-submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/30 transition duration-200 mt-2">
        💳 Bayar & Buka Loker
      </button>

    </form>

    <!-- Box Status Respon Server -->
    <div id="status-box" class="hidden mt-4 p-3 rounded-lg text-xs font-mono break-all"></div>
  </div>

  <script>
    async function prosesTransaksi(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const statusBox = document.getElementById('status-box');

      btn.disabled = true;
      btn.innerText = 'Memproses Transaksi...';
      statusBox.classList.remove('hidden');
      statusBox.className = 'mt-4 p-3 rounded-lg text-xs font-mono bg-amber-50 text-amber-800 border border-amber-200';
      statusBox.innerText = 'Mengirim data ke server backend Node.js...';

      const data = {
        nama: document.getElementById('nama').value,
        email: document.getElementById('email').value,
        bank: document.getElementById('bank').value,
        no_rek: document.getElementById('no_rek').value,
        type: document.querySelector('input[name="type"]:checked').value
      };

      try {
        const response = await fetch('http://localhost:3000/api/transaction', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
          statusBox.className = 'mt-4 p-3 rounded-lg text-xs font-mono bg-emerald-50 text-emerald-800 border border-emerald-200';
          statusBox.innerText = `✅ ${result.message}`;
        } else {
          statusBox.className = 'mt-4 p-3 rounded-lg text-xs font-mono bg-red-50 text-red-800 border border-red-200';
          statusBox.innerText = `❌ GAGAL: ${result.message}`;
        }
      } catch (err) {
        statusBox.className = 'mt-4 p-3 rounded-lg text-xs font-mono bg-red-50 text-red-800 border border-red-200';
        statusBox.innerText = '❌ Error: Gagal terhubung ke server backend Node.js (Port 3000). Pastikan "node server.js" sedang berjalan di terminal!';
      } finally {
        btn.disabled = false;
        btn.innerText = '💳 Bayar & Buka Loker';
      }
    }
  </script>
</body>
</html>
